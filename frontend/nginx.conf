server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: every non-asset path serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|svg|png|jpg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
