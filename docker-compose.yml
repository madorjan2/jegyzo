# Jegyzo – egyparancsos QA sandbox környezet
#
#   docker compose up -d        # MINDEN: alkalmazás + Kiwi TCMS + It's a Plan tracker
#   docker compose ps           # állapotok és healthcheckek
#   docker compose down         # leállítás (az adatok megmaradnak)
#   docker compose down -v      # leállítás ÉS az összes adat törlése
#
# Egyetlen stack: a Jegyzo alkalmazás (api, web, postgres, mailhog), a Kiwi TCMS
# tesztmenedzsment és az It's a Plan tracker (a JGY backlog forrása) együtt.
# Az alkalmazás build kontextusa: ./backend és ./frontend (mindkettőben Dockerfile).
# A tracker adatai a ./tracker/seed/jgy-seed.sql fájlból töltődnek be.
#
# Részletek: README.md, docs/02-architektura/02-docker-es-futtatas.md, tracker/README.md

name: jegyzo

services:
  # ------------------------------------------------------------ alkalmazás DB
  postgres:
    image: postgres:16-alpine
    container_name: jegyzo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jegyzo}
      POSTGRES_USER: ${POSTGRES_USER:-jegyzo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jegyzo_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jegyzo} -d ${POSTGRES_DB:-jegyzo}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # ------------------------------------------------------------ levélfogadó
  # Minden kimenő e-mail ide fut be; valódi küldés nincs.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: jegyzo-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # -------------------------------------------------------------- alkalmazás
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jegyzo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-jegyzo}:${POSTGRES_PASSWORD:-jegyzo_dev_pw}@postgres:5432/${POSTGRES_DB:-jegyzo}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-10}
      SERVICE_FEE_PER_TICKET: ${SERVICE_FEE_PER_TICKET:-250}
      DEFAULT_MAX_TICKETS_PER_USER: ${DEFAULT_MAX_TICKETS_PER_USER:-8}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-hu}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-hu,en}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Jegyzo}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@jegyzo.local}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jegyzo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
    ports:
      - "${WEB_PORT:-5173}:5173"

  # ---------------------------------------------------------------- Kiwi TCMS
  # Tesztmenedzsment (a sandbox nem része, csak egyparancsos elérhetőség).
  kiwi-db:
    image: mariadb:11.4
    container_name: jegyzo-kiwi-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${KIWI_DB_ROOT_PASSWORD:-kiwi_root_pw}
      MARIADB_DATABASE: ${KIWI_DB_NAME:-kiwi}
      MARIADB_USER: ${KIWI_DB_USER:-kiwi}
      MARIADB_PASSWORD: ${KIWI_DB_PASSWORD:-kiwi_dev_pw}
    volumes:
      - kiwi-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Egyszer lefutó inicializálás: séma, admin felhasználó, domain, jogosultságok.
  # Enélkül a Kiwi TCMS nem használható (a hivatalos út interaktív, ezért itt
  # automatizálva van).
  kiwi-init:
    image: pub.kiwitcms.eu/kiwitcms/kiwi:latest
    container_name: jegyzo-kiwi-init
    restart: "no"
    depends_on:
      kiwi-db:
        condition: service_healthy
    environment:
      KIWI_DB_HOST: kiwi-db
      KIWI_DB_PORT: "3306"
      KIWI_DB_NAME: ${KIWI_DB_NAME:-kiwi}
      KIWI_DB_USER: ${KIWI_DB_USER:-kiwi}
      KIWI_DB_PASSWORD: ${KIWI_DB_PASSWORD:-kiwi_dev_pw}
      DJANGO_SUPERUSER_USERNAME: ${KIWI_ADMIN_USER:-admin}
      DJANGO_SUPERUSER_EMAIL: ${KIWI_ADMIN_EMAIL:-admin@jegyzo.local}
      DJANGO_SUPERUSER_PASSWORD: ${KIWI_ADMIN_PASSWORD:-kiwiadmin123}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Kiwi TCMS inicializálás..."
        python /Kiwi/manage.py migrate --noinput
        python /Kiwi/manage.py createsuperuser --noinput || echo "admin már létezik"
        python /Kiwi/manage.py set_domain localhost || true
        python /Kiwi/manage.py refresh_permissions
        echo "Kiwi TCMS kész."

  # Egyszer lefutó tanúsítvány-generálás. A Kiwi image beépített tanúsítványa a
  # "buildkitsandbox" névre szól, ezért a böngészőn kívül minden ellenőrző
  # kliens (curl, Python, MCP szerver) hostnév-hibával elutasítja a
  # https://localhost:8443 címet. Ez a szolgáltatás a használt nevekre generál
  # újat; idempotens, és az nginx a /Kiwi/ssl alatti fájlokat olvassa.
  kiwi-ssl:
    image: alpine:3.20
    container_name: jegyzo-kiwi-ssl
    restart: "no"
    volumes:
      - kiwi-ssl:/ssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # A névtelen kötet a Docker viselkedése miatt az image /Kiwi/ssl tartalmával
        # jön létre, ezért a meglévő fájl nem elég: ellenőrizni kell, hogy a
        # tanúsítvány a localhost névre is érvényes-e.
        apk add --no-cache openssl >/dev/null
        if [ -s /ssl/localhost.crt ] && [ -s /ssl/localhost.key ] &&
           openssl x509 -in /ssl/localhost.crt -noout -checkhost localhost >/dev/null 2>&1; then
          echo "Kiwi TLS tanúsítvány már a localhost névre szól."
          exit 0
        fi
        openssl req -x509 -newkey rsa:2048 -sha256 -days 825 -nodes \
          -keyout /ssl/localhost.key -out /ssl/localhost.crt \
          -subj "/CN=localhost/O=Jegyzo sandbox" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1,DNS:buildkitsandbox" \
          -addext "basicConstraints=critical,CA:FALSE" \
          -addext "keyUsage=critical,digitalSignature,keyEncipherment" \
          -addext "extendedKeyUsage=serverAuth"
        chown 1001:0 /ssl/localhost.crt /ssl/localhost.key
        chmod 644 /ssl/localhost.crt
        chmod 640 /ssl/localhost.key
        echo "Kiwi TLS tanúsítvány kész (localhost, 127.0.0.1)."

  kiwi:
    image: pub.kiwitcms.eu/kiwitcms/kiwi:latest
    container_name: jegyzo-kiwi
    restart: unless-stopped
    depends_on:
      kiwi-db:
        condition: service_healthy
      kiwi-init:
        condition: service_completed_successfully
      kiwi-ssl:
        condition: service_completed_successfully
    environment:
      KIWI_DB_HOST: kiwi-db
      KIWI_DB_PORT: "3306"
      KIWI_DB_NAME: ${KIWI_DB_NAME:-kiwi}
      KIWI_DB_USER: ${KIWI_DB_USER:-kiwi}
      KIWI_DB_PASSWORD: ${KIWI_DB_PASSWORD:-kiwi_dev_pw}
    ports:
      - "${KIWI_PORT:-8080}:8080"
      - "${KIWI_HTTPS_PORT:-8443}:8443"
    volumes:
      - kiwi-uploads:/Kiwi/uploads
      - kiwi-ssl:/Kiwi/ssl:ro
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,ssl;ctx=ssl._create_unverified_context();urllib.request.urlopen('https://127.0.0.1:8443/',context=ctx,timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ------------------------------------------------------ It's a Plan tracker
  # A fejlesztői backlog (JGY projekt) forrása: önálló It's a Plan példány.
  # A seed (tracker/seed/jgy-seed.sql) csak akkor töltődik be, ha a JGY projekt
  # még nem létezik, és a JGY-n kívül mást nem hoz létre.
  #
  # FONTOS: a TRACKER_VERSION a seeddel együtt mozog. A seed a fenti kiadás
  # séma-sorrendjét követi, ezért verziófrissítésnél újra kell generálni
  # (python tools/itsaplan/export_tracker_seed.py), különben a seed betöltése
  # elhasal ("missing data for column ...").
  tracker-postgres:
    image: postgres:17-alpine
    container_name: jegyzo-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TRACKER_POSTGRES_USER:-itsaplan}
      POSTGRES_PASSWORD: ${TRACKER_POSTGRES_PASSWORD:?set TRACKER_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${TRACKER_POSTGRES_DB:-itsaplan}
    volumes:
      - tracker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRACKER_POSTGRES_USER:-itsaplan} -d ${TRACKER_POSTGRES_DB:-itsaplan}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # S3-kompatibilis objektumtároló a csatolmányoknak. Csak a belső hálózaton él.
  tracker-minio:
    image: rustfs/rustfs:1.0.0
    container_name: jegyzo-tracker-minio
    restart: unless-stopped
    user: '0:0'
    environment:
      RUSTFS_ACCESS_KEY: ${TRACKER_S3_ACCESS_KEY_ID:?set TRACKER_S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${TRACKER_S3_SECRET_ACCESS_KEY:?set TRACKER_S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - tracker-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:9000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  tracker-minio-init:
    image: rustfs/rustfs:1.0.0
    container_name: jegyzo-tracker-minio-init
    restart: 'no'
    depends_on:
      tracker-minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${TRACKER_S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${TRACKER_S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${TRACKER_S3_BUCKET:-planner-attachments}
    entrypoint: >
      /bin/sh -c "
      curl -fsS -X PUT --aws-sigv4 aws:amz:us-east-1:s3 --user \"$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY\" http://tracker-minio:9000/\"$$S3_BUCKET\" &&
      echo 'bucket ready: '\"$$S3_BUCKET\"
      "

  tracker-migrate:
    image: ghcr.io/croffasia/itsaplan-api:${TRACKER_VERSION:-1.1.0}
    container_name: jegyzo-tracker-migrate
    restart: 'no'
    command: ['bun', 'run', 'packages/db/src/migrate.ts']
    depends_on:
      tracker-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${TRACKER_POSTGRES_USER:-itsaplan}:${TRACKER_POSTGRES_PASSWORD}@tracker-postgres:5432/${TRACKER_POSTGRES_DB:-itsaplan}
      BACKUP_RETENTION_DAYS: ${TRACKER_BACKUP_RETENTION_DAYS:-30}
      SKIP_PRE_MIGRATION_BACKUP: ${TRACKER_SKIP_PRE_MIGRATION_BACKUP:-}
    volumes:
      - tracker-db-backups:/backups

  # Egyszer lefutó seed: a JGY projektet tölti be, ha még nincs. Újrafuttatható.
  tracker-seed:
    image: postgres:17-alpine
    container_name: jegyzo-tracker-seed
    restart: 'no'
    depends_on:
      tracker-postgres:
        condition: service_healthy
      tracker-migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: tracker-postgres
      PGUSER: ${TRACKER_POSTGRES_USER:-itsaplan}
      PGPASSWORD: ${TRACKER_POSTGRES_PASSWORD}
      PGDATABASE: ${TRACKER_POSTGRES_DB:-itsaplan}
    volumes:
      - ./tracker/seed:/seed:ro
    entrypoint: ['/bin/sh', '/seed/seed.sh']

  tracker-api:
    image: ghcr.io/croffasia/itsaplan-api:${TRACKER_VERSION:-1.1.0}
    container_name: jegyzo-tracker-api
    restart: unless-stopped
    command: ['bun', 'run', 'apps/api/src/index.ts']
    depends_on:
      tracker-postgres:
        condition: service_healthy
      tracker-migrate:
        condition: service_completed_successfully
      tracker-minio-init:
        condition: service_completed_successfully
      tracker-seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://${TRACKER_POSTGRES_USER:-itsaplan}:${TRACKER_POSTGRES_PASSWORD}@tracker-postgres:5432/${TRACKER_POSTGRES_DB:-itsaplan}
      BETTER_AUTH_SECRET: ${TRACKER_BETTER_AUTH_SECRET:?set TRACKER_BETTER_AUTH_SECRET in .env}
      APP_ENCRYPTION_KEY: ${TRACKER_APP_ENCRYPTION_KEY:?set TRACKER_APP_ENCRYPTION_KEY in .env}
      API_URL: http://localhost:${TRACKER_API_PORT:-3000}
      APP_URL: http://localhost:${TRACKER_WEB_PORT:-3001}
      S3_ENDPOINT: http://tracker-minio:9000
      S3_BUCKET: ${TRACKER_S3_BUCKET:-planner-attachments}
      S3_ACCESS_KEY_ID: ${TRACKER_S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${TRACKER_S3_SECRET_ACCESS_KEY}
      S3_REGION: ${TRACKER_S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${TRACKER_S3_FORCE_PATH_STYLE:-}
    ports:
      - '${TRACKER_API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  tracker-worker:
    image: ghcr.io/croffasia/itsaplan-worker:${TRACKER_VERSION:-1.1.0}
    container_name: jegyzo-tracker-worker
    restart: unless-stopped
    depends_on:
      tracker-postgres:
        condition: service_healthy
      tracker-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${TRACKER_POSTGRES_USER:-itsaplan}:${TRACKER_POSTGRES_PASSWORD}@tracker-postgres:5432/${TRACKER_POSTGRES_DB:-itsaplan}
      APP_ENCRYPTION_KEY: ${TRACKER_APP_ENCRYPTION_KEY:?set TRACKER_APP_ENCRYPTION_KEY in .env}
      TELEMETRY_DISABLED: ${TRACKER_TELEMETRY_DISABLED:-1}
      S3_ENDPOINT: http://tracker-minio:9000
      S3_BUCKET: ${TRACKER_S3_BUCKET:-planner-attachments}
      S3_ACCESS_KEY_ID: ${TRACKER_S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${TRACKER_S3_SECRET_ACCESS_KEY}
      S3_REGION: ${TRACKER_S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${TRACKER_S3_FORCE_PATH_STYLE:-}

  tracker-bot:
    image: ghcr.io/croffasia/itsaplan-bot:${TRACKER_VERSION:-1.1.0}
    container_name: jegyzo-tracker-bot
    restart: unless-stopped
    depends_on:
      tracker-postgres:
        condition: service_healthy
      tracker-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${TRACKER_POSTGRES_USER:-itsaplan}:${TRACKER_POSTGRES_PASSWORD}@tracker-postgres:5432/${TRACKER_POSTGRES_DB:-itsaplan}
      APP_ENCRYPTION_KEY: ${TRACKER_APP_ENCRYPTION_KEY:?set TRACKER_APP_ENCRYPTION_KEY in .env}

  tracker-web:
    image: ghcr.io/croffasia/itsaplan-web:${TRACKER_VERSION:-1.1.0}
    container_name: jegyzo-tracker-web
    restart: unless-stopped
    depends_on:
      - tracker-api
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      API_URL: http://localhost:${TRACKER_API_PORT:-3000}
      SERVICE_URL_API: http://tracker-api:3000
      PRIVACY_URL: ${TRACKER_PRIVACY_URL:-}
      TERMS_URL: ${TRACKER_TERMS_URL:-}
    ports:
      - '${TRACKER_WEB_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3001/login']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  kiwi-db-data:
  kiwi-uploads:
  kiwi-ssl:
  tracker-postgres-data:
  tracker-minio-data:
  tracker-db-backups:
